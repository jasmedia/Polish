name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      # On-device model tests skip themselves: Apple Intelligence isn't available on CI runners.
      - name: PolishCore tests
        run: make test-core
      - name: App tests
        run: make test-app
      - name: Bundle the app (ad-hoc signed)
        run: make app
