name: Release

# Two ways to publish an ad-hoc signed DMG as a GitHub release (not notarized: README › Install
# explains the one-time Open Anyway step):
#   - Actions › Release › Run workflow, picking patch, minor or major: bumps App/Info.plist on main,
#     builds and tests, then commits "Release vX.Y.Z", tags it and publishes. "current" releases the
#     version already in App/Info.plist without a bump (for the first release of a version set by hand).
#   - Pushing a tag that matches App/Info.plist's version (git tag v1.1.0 && git push origin v1.1.0).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major, current]
        default: patch
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: xcode-27
    # The release app's key is only needed (and only allowed) for the button run on main; a tag
    # push isn't a protected branch, so it runs without the environment.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release' || '' }}
    # Creates the release and its tag. The version bump goes to main as the release app.
    permissions:
      contents: write
    steps:
      # The main ruleset blocks every push except from the release app (its bypass list).
      - name: Get a release app token
        id: app-token
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A run from the button bumps the version on main, so it needs main itself.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Bump the version
        if: github.event_name == 'workflow_dispatch'
        # Inputs go through env, never inlined into the script.
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [[ "${BUMP}" == current ]]; then
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          else
            version="$(scripts/bump-version.sh "${BUMP}")"
          fi
          echo "TAG=v${version}" >> "$GITHUB_ENV"

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match App/Info.plist version ${version}"
            exit 1
          fi
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Check the tag is new
        run: |
          git fetch --tags --quiet
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

      # On-device model tests skip themselves: Apple Intelligence isn't available on CI runners.
      - name: Tests
        run: make test

      - name: Build the DMG (ad-hoc signed)
        run: scripts/release.sh

      # Only after the build passed, so a failed run leaves main and the tags as they were.
      - name: Commit the version bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet App/Info.plist; then
            git commit -m "Release ${TAG}" App/Info.plist
            git push origin HEAD:main
          fi

      # The release creates the tag with GITHUB_TOKEN, which starts no workflows. A tag pushed with
      # the app token would start this workflow again on the tag.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" .build/release-dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "Polish ${TAG#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
