[project]
name = "polish-eval"
version = "0.1.0"
description = "Prompt evaluation for Polish using Apple's Foundation Models SDK for Python"
requires-python = ">=3.10"
dependencies = [
    "apple-fm-sdk>=0.2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "jupyter>=1.1",
]

[tool.uv]
# apple-fm-sdk builds against FoundationModels.framework, so resolve for macOS only.
environments = ["sys_platform == 'darwin'"]
package = false
